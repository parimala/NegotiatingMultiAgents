[project]
name = "procurement-agent"
version = "0.1.0"
description = "Procurement agent Azure Functions project"
requires-python = ">=3.11"
dependencies = [
    "azure-functions>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "agents",
    "models",
    "orchestration",
    "activities",
    "database",
    "services",
    "config",
    "tests",
    "function_app.py",
    "hello_world.py",
]
